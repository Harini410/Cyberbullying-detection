version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cybersafe-backend
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - ENVIRONMENT=production
      - CORS_ORIGINS=http://localhost:3000,http://frontend:3000
      - DATABASE_URL=sqlite:///./cyberbullying.db
      - LLM_PROVIDER=mock
      - ROBERTA_MODEL_NAME=cardiffnlp/twitter-roberta-base-offensive
      - USE_GPU=false
    volumes:
      - ./data:/app/data
      - ./cyberbullying.db:/app/cyberbullying.db
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: cybersafe-frontend
    ports:
      - "3000:3000"
    environment:
      - BACKEND_API_URL=http://backend:8000
      - NEXT_PUBLIC_BACKEND_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped
